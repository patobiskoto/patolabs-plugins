name: ci

# FOUNDRY-156 / ADR-0025: a fork PR is allowed to create a workflow run, but
# it matches no executable job. Internal PRs use only GitHub-hosted ephemeral
# runners and no repository secret.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  plan:
    # PAT-142: decides which suites a run needs. The rule lives in scripts/ci_plan.py
    # (unit-tested by the catalogue job). Fail safe: any doubt runs everything.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.fork == false
    runs-on: ubuntu-24.04
    outputs:
      run_foundry: ${{ steps.plan.outputs.run_foundry }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # The merge base of the PR is needed for a three-dot `git diff`.
          fetch-depth: 0
      - id: plan
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 scripts/ci_plan.py

  foundry:
    # Do not use the pull_request_target event; it would expose base-repository authority
    # while evaluating untrusted fork content.
    #
    # PAT-142: a PR that changes only plugins/ship-ios/ skips this whole job, so the
    # required `foundry` check ends as `skipped` (never as a success with no test run).
    # Push to main and release PRs always run it (see scripts/ci_plan.py).
    # Fail safe: the job is skipped ONLY when `plan` explicitly output `false`. A job
    # whose `needs` failed is skipped by default, so `!cancelled()` (a status check
    # function) keeps this job running after a failed `plan`, whose output is then empty.
    # On a fork PR `plan` is skipped and the fork guard below is false: no executable job.
    needs: plan
    if: >-
      !cancelled() &&
      (github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.fork == false) &&
      needs.plan.outputs.run_foundry != 'false'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: plugins/foundry
    steps:
      # Audited immutable action dependencies (2026-09-20).
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes ripgrep
          pip install pytest pytest-xdist ruff==0.16.1
      - name: Compile tooling
        run: python -m compileall tooling
      - name: Lint
        run: ruff check tooling tests hooks
      - name: Validate model-routing invocation contract
        run: pytest -q tests/test_routing_contract.py
      - name: Run tracker conformance suite
        run: pytest -q -m tracker_conformance tests
      - name: Run public pure-logic tests (parallel)
        # Only tests marked historical_fixture require evidence deliberately omitted
        # from the public successor snapshot. Active tests in those modules still run.
        # PAT-142: one worker per core (pytest-xdist); a worker is a separate process,
        # so the tests that signal their own process do not touch each other.
        run: >-
          pytest -q -n auto -m "not integration and not benchmark_campaign and not historical_fixture and not timing_sensitive" tests
          --ignore=tests/test_routing_contract.py
      - name: Run timing-sensitive tests (serial)
        # Tests that assert a wall-clock bound or race a reader thread against a producer;
        # run alone so a loaded runner cannot fail them. Selected by the marker declared
        # in pytest.ini.
        run: >-
          pytest -q -p no:xdist -m "timing_sensitive and not integration and not benchmark_campaign and not historical_fixture" tests

  ship-ios:
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.fork == false
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: plugins/ship-ios
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      # PAT-142: the tests need Python, git and ruby (to evaluate the Fastfile), and no
      # Xcode or simulator. Ruby is installed only if the runner image lacks it.
      - name: Ensure ruby is available
        run: command -v ruby || (sudo apt-get update && sudo apt-get install --yes ruby)
      - name: Run tests
        run: python3 -m unittest discover -s tests -p 'test_*.py'

  catalogue:
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.fork == false
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - name: Validate both marketplaces and plugin manifests
        run: |
          python -m unittest scripts/test_validate_plugins.py scripts/test_ci_plan.py -v
          python scripts/validate_plugins.py
