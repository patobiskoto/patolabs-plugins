[pytest]
addopts = -m "not integration"
markers =
    integration: opt-in tests that call a real external service
    devhub_live: PAT-296 live DevHub conformance suite (tests/integration/test_devhub_live_conformance.py);
        skipped without DEVHUB_LIVE_URL, see docs/devhub-requirements.md
    tracker_conformance: deterministic PAT-68 Tracker-port conformance cases over fake transports
    benchmark_campaign: opt-in tests that revalidate benchmark-campaign or POC
        artifacts under benchmarks/ (see FOUNDRY-ADR-0019). Excluded from the
        default suite; replay with `pytest -m benchmark_campaign tests`.
    timing_sensitive: tests that assert a wall-clock bound or race a reader thread against a
        producer and were marked in PAT-142 to run alone, after the parallel run. Only
        test_local_attempt_is_bounded_in_steps_when_the_stream_exposes_them was observed to
        fail under parallel load (one local -n 4 run); the others assert a time bound and
        were marked as a precaution
        (one local_scout test later failed in the serial CI step, PLP-338). Unmarked tests may also assert time bounds.
    historical_fixture: tests that require historical evidence deliberately omitted
        or sanitized in the public successor snapshot
