[pytest]
addopts = -m "not integration"
markers =
    integration: opt-in tests that call a real external service
    benchmark_campaign: opt-in tests that revalidate benchmark-campaign or POC
        artifacts under benchmarks/ (see FOUNDRY-ADR-0019). Excluded from the
        default suite; replay with `pytest -m benchmark_campaign tests`.
    historical_fixture: tests that require historical evidence deliberately omitted
        or sanitized in the public successor snapshot
